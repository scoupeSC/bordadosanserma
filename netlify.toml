# Monorepo: la app vive en web/
[build]
  base = "web"
  # Obligatorio con base=web: el UI no puede usar publish=web (misma ruta que base → falla el plugin Next)
  publish = ".next"
  # scripts/netlify-build.sh: install limpia en Linux (Tailwind oxide)
  command = "bash scripts/netlify-build.sh"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
