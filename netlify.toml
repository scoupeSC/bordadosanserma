# Monorepo: la app vive en web/
[build]
  base = "web"
  # install (no ci) evita fallos de lockfile entre versiones de npm en Netlify
  command = "node -v && npm -v && npm install && npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
