# Monorepo: la app vive en web/
[build]
  base = "web"
  # scripts/netlify-build.sh: install limpia en Linux (Tailwind oxide); no usar comando viejo del UI
  command = "bash scripts/netlify-build.sh"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
